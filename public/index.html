<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steward</title>
<style>
  :root {
    --bg:#0d1117; --panel:#11161d; --edge:#2d3744; --text:#e6edf3; --mute:#8b949e;
    --green:#3fb950; --amber:#d29922; --blue:#1f6feb; --red:#f85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:baseline; gap:14px; padding:22px 28px; border-bottom:1px solid var(--edge); }
  h1 { font-size:22px; margin:0; letter-spacing:-.5px; }
  h1 span { color:var(--green); }
  header .sub { color:var(--mute); font-size:13px; }
  header .live { margin-left:auto; color:var(--mute); font-size:12px; font-family:ui-monospace,monospace; }
  main { padding:24px 28px 60px; max-width:1040px; }
  .tiles { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:28px; }
  .tile { background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:12px 18px; min-width:120px; }
  .tile b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .tile span { color:var(--mute); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.8px; color:var(--mute);
       margin:30px 0 12px; font-weight:600; }
  .card { background:var(--panel); border:1px solid var(--edge); border-left:3px solid var(--amber);
          border-radius:12px; padding:16px 18px; margin-bottom:12px; }
  .card .head { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .type { font-family:ui-monospace,monospace; font-weight:600; }
  .why { color:var(--amber); font-size:13px; }
  .meta { color:var(--mute); font-size:12px; margin-left:auto; font-family:ui-monospace,monospace; }
  pre { background:#0a0e14; border:1px solid var(--edge); border-radius:8px; padding:12px 14px;
        font:12.5px/1.6 ui-monospace,monospace; color:#adbac7; overflow:auto; margin:12px 0 0; white-space:pre-wrap; }
  .row { display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  input { flex:1; min-width:180px; background:#0a0e14; border:1px solid var(--edge); border-radius:8px;
          color:var(--text); padding:8px 11px; font:13px inherit; }
  button { border:1px solid transparent; border-radius:8px; padding:8px 16px; font:600 13px inherit; cursor:pointer; }
  .approve { background:#238636; color:#fff; }
  .reject  { background:transparent; border-color:#3d4551; color:var(--mute); }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; font:13px ui-monospace,monospace; }
  td { padding:7px 10px; border-bottom:1px solid rgba(45,55,68,.6); color:#adbac7; }
  tr td:last-child { text-align:right; color:var(--mute); }
  .pill { font-size:11px; padding:2px 9px; border-radius:999px; border:1px solid var(--edge); color:var(--mute); }
  .s-completed { color:var(--green); } .s-awaiting_approval { color:var(--amber); }
  .s-rejected, .s-failed, .s-expired { color:var(--red); }
  .empty { color:var(--mute); font-size:14px; padding:6px 2px; }
  .flash { color:var(--red); font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>Steward<span>.</span></h1>
  <div class="sub">autonomous operations, with a human approval gate</div>
  <div class="live" id="live">connecting</div>
</header>

<main>
  <div class="tiles" id="tiles"></div>

  <h2>Waiting for a person</h2>
  <div id="waiting"></div>

  <h2>Jobs</h2>
  <table id="jobs"></table>

  <h2>Audit log</h2>
  <table id="audit"></table>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = (ms) => {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
};

let busy = false;

async function decide(id, action, button) {
  const note = document.querySelector(`[data-note="${id}"]`).value;
  const who = localStorage.getItem('steward.reviewer') || 'dashboard';
  button.disabled = true;
  const res = await fetch(`/api/approvals/${id}/${action}`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ by: who, note: note || null }),
  });
  if (res.status === 409) {
    const body = await res.json();
    const flash = document.querySelector(`[data-flash="${id}"]`);
    // Two reviewers, one decision. The server refuses the second; saying so is
    // more useful than quietly redrawing the row.
    flash.textContent = `Already ${body.status} by ${body.by || 'someone'}. Nothing changed.`;
  }
  await refresh();
}

function renderWaiting(rows) {
  if (!rows.length) { $('waiting').innerHTML = '<div class="empty">Nothing is waiting.</div>'; return; }
  $('waiting').innerHTML = rows.map((a) => `
    <div class="card">
      <div class="head">
        <span class="type">${esc(a.type)}</span>
        <span class="why">${esc(a.reason)}</span>
        <span class="meta">#${a.id} &middot; asked ${ago(a.requested_at)}</span>
      </div>
      <pre>${esc(JSON.stringify(a.payload))}</pre>
      ${a.draft ? `<pre>${esc(a.draft.body)}</pre>
        <div class="row"><span class="pill">written by ${esc(a.draft.model)}</span>
        <span class="pill">sources: ${esc(JSON.parse(a.draft.sources || '[]').join(', ') || 'none')}</span></div>` : ''}
      <div class="row">
        <input data-note="${a.id}" placeholder="why (recorded in the audit log)">
        <button class="reject"  onclick="decide(${a.id},'reject',this)">Reject</button>
        <button class="approve" onclick="decide(${a.id},'approve',this)">Approve</button>
      </div>
      <div class="flash" data-flash="${a.id}"></div>
    </div>`).join('');
}

function renderTiles(s) {
  const j = s.jobs || {};
  const tiles = [
    ['waiting for a person', s.waiting],
    ['completed', j.completed || 0],
    ['in the queue', (j.pending || 0) + (j.in_progress || 0)],
    ['rejected', (j.rejected || 0) + (j.expired || 0)],
    ['failed', j.failed || 0],
    ['emails sent', s.emails],
  ];
  $('tiles').innerHTML = tiles.map(([k, v]) => `<div class="tile"><b>${v}</b><span>${k}</span></div>`).join('');
}

function renderJobs(rows) {
  $('jobs').innerHTML = rows.slice(0, 12).map((j) => `
    <tr><td>#${j.id}</td><td>${esc(j.type)}</td>
    <td class="s-${esc(j.status)}">${esc(j.status)}</td>
    <td>${esc(j.last_error || '')}</td><td>${ago(j.updated_at)}</td></tr>`).join('');
}

function renderAudit(rows) {
  $('audit').innerHTML = rows.slice(0, 15).map((r) => `
    <tr><td>${r.job_id ? '#' + r.job_id : ''}</td><td>${esc(r.event)}</td>
    <td>${esc(r.detail || '')}</td><td>${ago(r.created_at)}</td></tr>`).join('');
}

async function refresh() {
  if (busy) return;
  busy = true;
  try {
    const [summary, approvals, jobs, audit] = await Promise.all(
      ['summary', 'approvals', 'jobs', 'audit'].map((p) => fetch('/api/' + p).then((r) => r.json())));
    renderTiles(summary);
    renderWaiting(approvals);
    renderJobs(jobs);
    renderAudit(audit);
    $('live').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    $('live').textContent = 'not reachable';
  } finally {
    busy = false;
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
